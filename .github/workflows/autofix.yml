---
name: autofix.ci

on:
  pull_request: {}
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Run fixers
        uses: j178/prek-action@v3.0.1
        with:
          prek-version: 0.5.2
          cache: false
          extra-args: >-
            --all-files --hook-stage pre-commit --no-fail-fast --verbose
        env:
          UV_NO_CACHE: "1"
          UV_PYTHON: "3.14"

      - uses: autofix-ci/action@v1.3.4
        if: always()
